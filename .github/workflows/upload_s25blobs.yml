name: Upload Blobs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [r9q2]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free up space
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' || echo "::warning::The command [sudo apt-get remove -y '^aspnetcore-.*'] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^dotnet-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y 'php.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y 'php.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^mongodb-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y '^mysql-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^mysql-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell libgl1-mesa-dri --fix-missing || echo "::warning::The command [sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell libgl1-mesa-dri --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y google-cloud-sdk --fix-missing || echo "::debug::The command [sudo apt-get remove -y google-cloud-sdk --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get remove -y google-cloud-cli --fix-missing || echo "::debug::The command [sudo apt-get remove -y google-cloud-cli --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get autoremove -y || echo "::warning::The command [sudo apt-get autoremove -y] failed to complete successfully. Proceeding..."
          sudo apt-get clean || echo "::warning::The command [sudo apt-get clean] failed to complete successfully. Proceeding..."

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Build dependencies
        run: source ./buildenv.sh ${{ matrix.target }}

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/download_fw.sh --force

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/extract_fw.sh --force

      - name: Zip selected firmware files and folders
        run: |
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/etc
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/priv-app/Moments
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/priv-app/SamsungSmartSuggestions
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/priv-app/PhotoEditor_AIFull
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/app/LiveTranscribe
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/app/HoneyBoard
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/system/system/app/SamsungAiCore
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/product/app/TrichromeLibrary64
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/product/app/WebViewGoogle64
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/product/priv-app/AICore
          zip -r out/fw_to_upload.zip out/fw/SM-S938B_EUX/product/priv-app/AiWallpaper

      - name: Upload to GoFile
        run: |
          ZIP_FILE=out/fw_to_upload.zip
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" "https://upload-eu-par.gofile.io/uploadFile")
          echo "Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'

          echo "MD5:"
          md5sum "$ZIP_FILE"

          echo "SHA256:"
          sha256sum "$ZIP_FILE"
