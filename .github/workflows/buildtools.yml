name: Build Tools

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'fifteen-snap'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [r9q2]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld jq protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Prepare zip from out/
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -d out ] && [ "$(find out -mindepth 1 -print -quit 2>/dev/null)" ]; then
            7z a -tzip "artifacts/${{ matrix.target }}-deps.zip" ./out/* >/dev/null
          else
            echo "No files found in ./out for target ${{ matrix.target }}, creating empty marker."
            mkdir -p out && touch out/EMPTY.txt
            7z a -tzip "artifacts/${{ matrix.target }}-deps.zip" ./out/* >/dev/null
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-deps
          path: artifacts/${{ matrix.target }}-deps.zip

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Build output"
            echo "- Target: ${{ matrix.target }}"
            echo "- Artifact uploaded: ${{ matrix.target }}-deps.zip"
          } >> "$GITHUB_STEP_SUMMARY"
